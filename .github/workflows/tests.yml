name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # release.yml runs this before publishing

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      # Offline suite only: live / integration / conformance tests need API
      # keys and real networks, and are run by hand before a release.
      - name: Run tests
        run: >
          uv run --python ${{ matrix.python-version }} pytest
          -m "not live and not integration and not conformance"
          --no-cov -q
