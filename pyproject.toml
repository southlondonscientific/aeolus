[project]
name = "aeolus_aq"
version = "0.4.2a"
authors = [
  { name="Ruaraidh Dobson", email="ruaraidh.dobson@gmail.com" },
]
description = """This module provides functions for downloading metadata and data files from
air quality networks and standardising them into a common pandas DataFrame format."""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3.3",
    "rdata>=0.11",
    "requests>=2.32.5",
    "tenacity>=8.2.0",
    "matplotlib>=3.7.0",

    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyarrow>=14.0.0",
]
keywords = [
    "air quality",
    "pollution",
    "AURN",
    "monitoring",
    "environmental data",
    "atmospheric science",
    "open data",
    "openaq",
    "sensor network",
    "PM2.5",
    "NO2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Framework :: Jupyter",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/southlondonscientific/aeolus"

[project.optional-dependencies]
openaq = ["openaq>=1.0.0rc2"]
purpleair = ["purpleair-api>=1.3.1"]
stats = [
    "statsmodels>=0.14.0",
]
all = [
    "openaq>=1.0.0rc2",
    "purpleair-api>=1.3.1",
    "statsmodels>=0.14.0",
]
progress = [
    "tqdm>=4.60",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "responses>=0.23.0",
    "freezegun>=1.2.2",
    "tqdm>=4.60",
    "openaq>=1.0.0rc2",
    "purpleair-api>=1.3.1",
    "statsmodels>=0.14.0",
    "hypothesis>=6.100.0",
    "mutmut>=3.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

[tool.setuptools.package-data]
aeolus = [
    "sources/_sos_mapping.json",
    "viz/fonts/*.ttf",
    "viz/fonts/OFL.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=aeolus",
    "--cov-report=term-missing",
    "--cov-report=html",
    "-v",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that need API keys",
    "live: marks tests that hit real APIs",
    "property: marks hypothesis property-based tests",
    "conformance: live data conformance tests — run before releases",
]

